# the RunOS CLI release pipeline, run by foreman on the foreman HOST (FCR #188).
#
# This repo is PUBLIC and its artefacts are built by GitHub Actions, not here.
# Foreman's job is therefore narrower than for a cluster deploy: run this repo's
# own gate chain, tag, push, then WATCH the workflow that does the building and
# verify what it published.
#
# The gate chain is NOT reimplemented here, on purpose. scripts/release.sh
# carries an unskippable leak gate that exists because real internal identifiers
# were published to a public repo and could not be unpublished. A second copy in
# foreman would be the copy that drifts, and the one that drifts is the one that
# fails open. So step one calls the script's own --check mode, which runs every
# gate and stops before any side effect.
#
# What foreman adds over running the script by hand: each step is recorded with
# its command, exit code, duration and output, and the run appears in the same
# deploy history as the cluster rollouts, so "list all the deploys" means all of
# them rather than one list per mechanism.
#
# The record. `deployed` holds the last commit that was tagged, a candidate or a
# final. A candidate moves `deployed` and nothing else. A FINAL moves `deployed`
# and also fast-forwards `main`, the prod record, to the commit the final's tag
# names. The dev target carries `deployed_branch: deployed` (an objective-scoped
# deploy gets its own rc ref). The prod target carries `deployed_branch: main`.
# scripts/record_ref.sh holds both rules, refuses a record that does not fit the
# env, and refuses anything but a fast-forward for main. It never forces main and
# it deletes no branch.
#
# gh authenticates from the host keyring, so no credential is injected here. The
# token never has to exist in foreman's store to begin with.

name: Release the RunOS CLI
description: Run this repo's full gate chain, tag and push, then watch the GitHub Actions release and verify what it published.
kind: github_release

# What this pipeline publishes, so foreman can advertise it after a successful
# deploy (FCR #230, foreman v0.148.0). The engine does the advertising itself:
# there is deliberately no advertise step and no call back into foreman from a
# shell step here, because a second implementation of a foreman decision is the
# one that drifts.
#
# The environment is a PLACEHOLDER, never a literal. The same pipeline serves
# more than one environment, so a constant would advertise the wrong one. It
# reads the `env` key of the deployment target, the same target-scoped spelling
# the steps below use for `branch` and `deployed_branch`.
advertises:
  component: cli
  env: "${{ target.env }}"

steps:
  - name: Final comes from the validated candidate
    description: A final version (no -rc) must be cut from the exact commit that shipped as a release candidate and that `deployed` records. If the integration branch has moved on since, the final would carry code no candidate validated. A final on a prod target must also be able to fast-forward main, so main must be an ancestor of dev. The target's record must fit its env. A candidate passes straight through.
    run: scripts/record_ref.sh final-check "${{ version }}" "${{ target.env }}" "${{ target.branch }}" "${{ target.deployed_branch }}"
    timeout: 120

  - name: Gate chain
    description: "scripts/release.sh --check: preflight, sensitivity scan, leak gate, scannability gate and the build/vet/test suite. Every gate, no side effects, and it cannot be skipped."
    run: RUNOS_RELEASE_RECORD_BRANCH="${{ target.deployed_branch }}" scripts/release.sh "${{ version }}" --check
    timeout: 1800

  - name: Tag and push
    description: Tags the integration branch and pushes both. The record is not touched here; the last step moves it once the release is verified.
    run: |
      git checkout --quiet ${{ target.branch }}
      sha="$(git rev-parse --short HEAD)"
      git tag "${{ version }}"
      git push --quiet origin ${{ target.branch }}
      git push --quiet origin "${{ version }}"
      echo "tagged ${{ version }} at $sha and pushed"

  - name: Wait for the release workflow
    description: GitHub builds the artefacts. Poll for the run this tag started, then block on it. A failed workflow fails the deploy.
    run: |
      run_id=""; waited=0
      while [ -z "$run_id" ] && [ "$waited" -lt 120 ]; do
        run_id="$(gh run list --workflow=release.yml --limit 15 \
          --json databaseId,headBranch,event \
          -q "[.[] | select(.headBranch==\"${{ version }}\" and .event==\"push\")][0].databaseId" 2>/dev/null || true)"
        [ -n "$run_id" ] && break
        sleep 10; waited=$((waited + 10))
      done
      test -n "$run_id" || { echo "no release run found for ${{ version }}"; exit 1; }
      echo "watching run $run_id"
      gh run watch "$run_id" --exit-status >/dev/null 2>&1 \
        || { echo "release workflow $run_id failed (gh run view $run_id --log-failed)"; exit 1; }
      echo "release workflow succeeded"
    timeout: 1800

  - name: Verify the published attestation
    description: Proves the artefact GitHub published was built by THIS workflow at THIS tag, not by something else. Binds the signer identity, not just the signature.
    run: |
      tmp="$(mktemp -d)"
      trap "rm -rf $tmp" EXIT
      nwo="$(gh api repos/{owner}/{repo} --jq .full_name)"
      gh release download "${{ version }}" --repo "$nwo" --pattern "runos-linux-amd64.tar.gz" --dir "$tmp" --clobber
      expected="https://github.com/$nwo/.github/workflows/release.yml@refs/tags/${{ version }}"
      actual="$(gh attestation verify "$tmp/runos-linux-amd64.tar.gz" --repo "$nwo" --format json 2>/dev/null \
        | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0][\"verificationResult\"][\"signature\"][\"certificate\"].get(\"subjectAlternativeName\",\"\"))" 2>/dev/null || true)"
      test -n "$actual" || { echo "attestation returned no signer identity"; exit 1; }
      test "$actual" = "$expected" || { echo "attestation identity mismatch: expected $expected, got $actual"; exit 1; }
      echo "attestation bound to $actual"
    timeout: 300

  - name: Record the release
    description: "Only now, on success, through scripts/record_ref.sh, the one place that defines the record. A candidate advances the record the target names. A final on a prod target advances deployed and fast-forwards main to the commit the final's tag names, and refuses anything that is not a fast-forward. Nothing is forced."
    run: |
      # Item 198. Use the ref foreman rewrites for an objective-scoped deploy,
      # so a mid-objective RC records to its own branch and leaves the shared
      # one alone. The target-scoped spelling is required: foreman resolves
      # only version, repo, ref and branch as bare names, and refuses the
      # deploy outright when a placeholder does not resolve. That refusal is
      # why there is no fallback here: an unresolved placeholder can never
      # reach this shell, so a fallback would only imply a safety net that
      # does not exist.
      #
      # ONE definition site. scripts/record_ref.sh carries this record, the
      # preflight in scripts/release.sh, and the manual step 6 of that script,
      # so the ref the gate checks is the ref this step moves by construction.
      #
      # WHAT THE OLD CODE GOT WRONG, kept here because it cost a deployment.
      # It pushed straight at refs/heads/$record and then ran
      # `git fetch --quiet origin "$record"`. A fetch with NO destination
      # refspec moves FETCH_HEAD and the remote-tracking ref only, so
      # refs/heads/$record never moved. The preflight then read the stale local
      # branch and died "not in sync with origin/...". Deployment 36 died
      # exactly there. record_ref.sh fetches the ref BEFORE it pushes, states
      # the value it expects to replace in the lease, moves the local copy and
      # the tracking ref together, and exits non-zero if they disagree.
      scripts/record_ref.sh record "${{ version }}" "${{ target.env }}" "${{ target.branch }}" "${{ target.deployed_branch }}"
    timeout: 120
    expect: [main_before, main_after, main_equals_final]
    observe: Printed for a final on a prod target only. main_after must equal the final's tagged commit and main_equals_final must be true. main_before is what main held before.
