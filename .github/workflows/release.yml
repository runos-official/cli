name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify dependencies
        run: go mod verify

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LDFLAGS="-X github.com/runos-official/cli/version.Version=${VERSION}"
          PLATFORMS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          mkdir -p dist

          for platform in "${PLATFORMS[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output="runos"
            ext="tar.gz"
            if [ "$GOOS" = "windows" ]; then
              output="runos.exe"
              ext="zip"
            fi

            echo "Building ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="$LDFLAGS -s -w" -o "dist/${output}" .

            archive="runos-${GOOS}-${GOARCH}.${ext}"
            if [ "$ext" = "zip" ]; then
              (cd dist && zip -q "../dist/${archive}" "${output}")
            else
              tar -czf "dist/${archive}" -C dist "${output}"
            fi

            # Back-compat alias for pre-v1.7.0 self-updaters. Those binaries
            # (v1.0.0-v1.6.0) hardcode a `runos-latest-{os}-{arch}` asset name
            # in their download + checksum-lookup paths; commit 5ec7510 renamed
            # the canonical asset to `runos-{os}-{arch}` and they have 404'd on
            # `runos update` ever since. Publishing a byte-identical copy under
            # the legacy name lets a stuck old binary self-update to current.
            # The copy is created before the checksum + attestation steps so it
            # is covered by both. Drop this once no pre-1.7.0 clients remain.
            alias="runos-latest-${GOOS}-${GOARCH}.${ext}"
            cp "dist/${archive}" "dist/${alias}"

            rm "dist/${output}"
            echo "Built: ${archive} (+ alias ${alias})"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      # Keyless (Sigstore/OIDC) build-provenance attestation for every
      # released archive. Binds each artifact's sha256 to this workflow's
      # OIDC identity, so a downstream verifier (the Templates validator and
      # `gh attestation verify ... --repo runos-official/cli`) can prove the
      # archive is the exact artifact this pipeline produced. No long-lived
      # secret, safe for a public repo.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/runos-*.tar.gz
            dist/runos-*.zip

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # An -rc.N (or any prerelease) tag shares its base version's notes:
          # dev RCs and the final release of the same vX.Y.Z use one section.
          # Strip the prerelease suffix (v1.11.2-rc.1 -> v1.11.2).
          BASE="${VERSION%%-*}"
          # Print lines after "## <BASE>" until the next "## " heading or EOF.
          # The trailing boundary keeps "## v1.11.2" from matching "## v1.11.20".
          NOTES=$(awk "
            /^## ${BASE}([[:space:]]|\$)/ { found=1; next }
            found && /^## /  { exit }
            found            { print }
          " CHANGELOG.md | awk 'NF{p=1} p')
          if [ -z "$NOTES" ]; then
            echo "No changelog entry found for ${BASE}, using auto-generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NOTES" > release_notes.txt
          fi

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release_notes.txt' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          files: dist/*
          # Tags containing "-" (semver pre-release suffix: -rc.1, -alpha,
          # -beta, ...) are marked as GitHub prereleases. Prereleases are
          # excluded from the repo's "Latest release" pointer, so the
          # `releases/latest/download/...` URL keeps serving the most
          # recent stable. Testers opt in to a prerelease explicitly via
          # `https://get.runos.com/cli.sh?release=<tag>`.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The repo has Immutable Releases enabled: assets cannot be
          # uploaded after a release is published. We create the release
          # as a draft so this action's asset upload step succeeds, then
          # flip it to published in the next step.
          draft: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
