name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify dependencies
        run: go mod verify

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LDFLAGS="-X github.com/runos-official/cli/version.Version=${VERSION}"
          PLATFORMS=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          mkdir -p dist

          for platform in "${PLATFORMS[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            output="runos"
            ext="tar.gz"
            if [ "$GOOS" = "windows" ]; then
              output="runos.exe"
              ext="zip"
            fi

            echo "Building ${GOOS}/${GOARCH}..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="$LDFLAGS -s -w" -o "dist/${output}" .

            archive="runos-latest-${GOOS}-${GOARCH}.${ext}"
            if [ "$ext" = "zip" ]; then
              (cd dist && zip -q "../dist/${archive}" "${output}")
            else
              tar -czf "dist/${archive}" -C dist "${output}"
            fi

            rm "dist/${output}"
            echo "Built: ${archive}"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          generate_release_notes: true
          files: dist/*
